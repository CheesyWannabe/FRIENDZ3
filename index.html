<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - Stream All Episodes</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF6B35;
            --primary-purple: #6A4C93;
            --warm-cream: #FFF8F0;
            --dark-bg: #1A1423;
            --card-bg: #2D2635;
            --text-primary: #FFFFFF;
            --text-secondary: #B8B8D1;
            --accent-yellow: #FFD23F;
            --hover-glow: rgba(255, 107, 53, 0.2);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #2D1B3D 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(106, 76, 147, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: clamp(3rem, 8vw, 6rem);
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--accent-yellow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Main Layout */
        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            margin-top: 40px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        /* Sidebar - Season Navigation */
        .sidebar {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-soft);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--accent-yellow);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .season-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .season-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            color: var(--text-secondary);
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .season-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .season-btn:hover::before {
            left: 100%;
        }

        .season-btn:hover {
            background: rgba(255, 107, 53, 0.1);
            border-color: var(--primary-orange);
            color: var(--text-primary);
            transform: translateX(5px);
        }

        .season-btn.active {
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
            color: var(--text-primary);
            border-color: var(--accent-yellow);
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
        }

        /* Video Player Section */
        .video-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-soft);
        }

        .player-header {
            margin-bottom: 25px;
        }

        .player-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .player-info {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .info-badge {
            background: rgba(255, 107, 53, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-yellow);
            border: 1px solid var(--primary-orange);
        }

        /* Video Player Container */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .loading-indicator.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 107, 53, 0.2);
            border-top-color: var(--primary-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-purple));
            border: none;
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.5);
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary-orange);
        }

        /* Episodes Grid */
        .episodes-section {
            margin-top: 30px;
        }

        .episodes-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--accent-yellow);
            font-weight: 700;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .episode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-orange), var(--primary-purple));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .episode-card:hover::before {
            transform: scaleX(1);
        }

        .episode-card:hover {
            background: rgba(255, 107, 53, 0.1);
            border-color: var(--primary-orange);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .episode-card.active {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(106, 76, 147, 0.2));
            border-color: var(--accent-yellow);
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
        }

        .episode-number {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .episode-title {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.4;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                top: 0;
            }

            .season-list {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .season-btn {
                flex: 1;
                min-width: 120px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header {
                padding: 30px 15px;
            }

            .logo {
                font-size: 3.5rem;
            }

            .video-section {
                padding: 20px;
            }

            .player-header h1 {
                font-size: 1.5rem;
            }

            .episodes-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .controls {
                gap: 10px;
            }

            .control-btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .season-list {
                flex-direction: column;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            color: var(--text-primary);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--primary-orange);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">Friends</h1>
            <p class="tagline">The One With All The Episodes</p>
        </header>

        <div class="main-content">
            <!-- Sidebar - Season Selection -->
            <aside class="sidebar">
                <h2>Seasons</h2>
                <div class="season-list" id="seasonList"></div>
            </aside>

            <!-- Main Video Section -->
            <main class="video-section">
                <div class="player-header">
                    <h1 id="episodeTitle">Select a season to start watching</h1>
                    <div class="player-info">
                        <span class="info-badge" id="seasonBadge">Season -</span>
                        <span class="info-badge" id="episodeBadge">Episode -</span>
                    </div>
                </div>

                <!-- Video Player -->
                <div class="video-container" id="videoContainer">
                    <div class="loading-indicator" id="loadingIndicator">
                        <div class="spinner"></div>
                        <p>Loading episode...</p>
                    </div>
                    <iframe id="videoPlayer" src="" allowfullscreen referrerpolicy="origin"></iframe>
                </div>

                <!-- Playback Controls -->
                <div class="controls">
                    <button class="control-btn secondary" id="prevBtn" disabled>← Previous</button>
                    <button class="control-btn" id="nextBtn" disabled>Next →</button>
                </div>

                <!-- Episodes Section -->
                <div class="episodes-section">
                    <h2 id="episodesHeader">Select a season</h2>
                    <div class="episodes-grid" id="episodesGrid"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Friends episode data (all 10 seasons)
        const friendsData = {
            1: { count: 24, title: "Season 1" },
            2: { count: 24, title: "Season 2" },
            3: { count: 25, title: "Season 3" },
            4: { count: 24, title: "Season 4" },
            5: { count: 24, title: "Season 5" },
            6: { count: 25, title: "Season 6" },
            7: { count: 24, title: "Season 7" },
            8: { count: 24, title: "Season 8" },
            9: { count: 24, title: "Season 9" },
            10: { count: 18, title: "Season 10" }
        };

        // Episode titles (sample titles for each season)
        const episodeTitles = {
            1: [
                "The Pilot", "The One with the Sonogram at the End", "The One with the Thumb",
                "The One with George Stephanopoulos", "The One with the East German Laundry Detergent",
                "The One with the Butt", "The One with the Blackout", "The One Where Nana Dies Twice",
                "The One Where Underdog Gets Away", "The One with the Monkey", "The One with Mrs. Bing",
                "The One with the Dozen Lasagnas", "The One with the Boobies", "The One with the Candy Hearts",
                "The One with the Stoned Guy", "The One with Two Parts (1)", "The One with Two Parts (2)",
                "The One with All the Poker", "The One Where the Monkey Gets Away", "The One with the Evil Orthodontist",
                "The One with the Fake Monica", "The One with the Ick Factor", "The One with the Birth",
                "The One Where Rachel Finds Out"
            ],
            2: Array(24).fill(null).map((_, i) => `Episode ${i + 1}`),
            3: Array(25).fill(null).map((_, i) => `Episode ${i + 1}`),
            4: Array(24).fill(null).map((_, i) => `Episode ${i + 1}`),
            5: Array(24).fill(null).map((_, i) => `Episode ${i + 1}`),
            6: Array(25).fill(null).map((_, i) => `Episode ${i + 1}`),
            7: Array(24).fill(null).map((_, i) => `Episode ${i + 1}`),
            8: Array(24).fill(null).map((_, i) => `Episode ${i + 1}`),
            9: Array(24).fill(null).map((_, i) => `Episode ${i + 1}`),
            10: Array(18).fill(null).map((_, i) => `Episode ${i + 1}`)
        };

        // State management
        let currentSeason = null;
        let currentEpisode = null;
        const IMDB_ID = 'tt0108778';

        // DOM Elements
        const seasonList = document.getElementById('seasonList');
        const episodesGrid = document.getElementById('episodesGrid');
        const videoPlayer = document.getElementById('videoPlayer');
        const episodeTitle = document.getElementById('episodeTitle');
        const seasonBadge = document.getElementById('seasonBadge');
        const episodeBadge = document.getElementById('episodeBadge');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const episodesHeader = document.getElementById('episodesHeader');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const toast = document.getElementById('toast');

        // Initialize the app
        function init() {
            renderSeasons();
            loadLastWatched();
        }

        // Render season buttons
        function renderSeasons() {
            seasonList.innerHTML = '';
            for (let season = 1; season <= 10; season++) {
                const btn = document.createElement('button');
                btn.className = 'season-btn';
                btn.textContent = `Season ${season}`;
                btn.onclick = () => selectSeason(season);
                seasonList.appendChild(btn);
            }
        }

        // Select a season
        function selectSeason(season) {
            currentSeason = season;
            renderEpisodes(season);
            updateSeasonButtons();
            episodesHeader.textContent = `Season ${season} Episodes`;
            
            // Auto-play first episode if none selected
            if (!currentEpisode || currentEpisode > friendsData[season].count) {
                playEpisode(season, 1);
            }
        }

        // Update active season button
        function updateSeasonButtons() {
            const buttons = seasonList.querySelectorAll('.season-btn');
            buttons.forEach((btn, index) => {
                btn.classList.toggle('active', index + 1 === currentSeason);
            });
        }

        // Render episodes grid
        function renderEpisodes(season) {
            episodesGrid.innerHTML = '';
            const episodeCount = friendsData[season].count;
            
            for (let ep = 1; ep <= episodeCount; ep++) {
                const card = document.createElement('div');
                card.className = 'episode-card';
                card.innerHTML = `
                    <div class="episode-number">Episode ${ep}</div>
                    <div class="episode-title">${getEpisodeTitle(season, ep)}</div>
                `;
                card.onclick = () => playEpisode(season, ep);
                episodesGrid.appendChild(card);
            }
            
            updateEpisodeCards();
        }

        // Get episode title
        function getEpisodeTitle(season, episode) {
            if (episodeTitles[season] && episodeTitles[season][episode - 1]) {
                return episodeTitles[season][episode - 1];
            }
            return `Episode ${episode}`;
        }

        // Update active episode card
        function updateEpisodeCards() {
            const cards = episodesGrid.querySelectorAll('.episode-card');
            cards.forEach((card, index) => {
                card.classList.toggle('active', index + 1 === currentEpisode);
            });
        }

        // Play episode
        function playEpisode(season, episode) {
            currentSeason = season;
            currentEpisode = episode;
            
            // Show loading indicator
            showLoading();
            
            // Update UI
            episodeTitle.textContent = getEpisodeTitle(season, episode);
            seasonBadge.textContent = `Season ${season}`;
            episodeBadge.textContent = `Episode ${episode}`;
            
            // Update video player
            const embedUrl = `https://vidsrc.net/embed/tv?imdb=${IMDB_ID}&season=${season}&episode=${episode}`;
            videoPlayer.src = embedUrl;
            
            // Update buttons
            updateControls();
            updateEpisodeCards();
            updateSeasonButtons();
            
            // Save to local storage
            saveLastWatched(season, episode);
            
            // Hide loading after delay
            setTimeout(() => hideLoading(), 1500);
            
            // Show toast
            showToast(`Playing S${season}E${episode}`);
        }

        // Update control buttons
        function updateControls() {
            // Previous button
            const hasPrevious = currentEpisode > 1 || currentSeason > 1;
            prevBtn.disabled = !hasPrevious;
            
            // Next button
            const hasNext = currentEpisode < friendsData[currentSeason].count || currentSeason < 10;
            nextBtn.disabled = !hasNext;
        }

        // Previous episode
        function previousEpisode() {
            if (currentEpisode > 1) {
                playEpisode(currentSeason, currentEpisode - 1);
            } else if (currentSeason > 1) {
                const prevSeason = currentSeason - 1;
                const lastEpisode = friendsData[prevSeason].count;
                selectSeason(prevSeason);
                playEpisode(prevSeason, lastEpisode);
            }
        }

        // Next episode
        function nextEpisode() {
            if (currentEpisode < friendsData[currentSeason].count) {
                playEpisode(currentSeason, currentEpisode + 1);
            } else if (currentSeason < 10) {
                selectSeason(currentSeason + 1);
                playEpisode(currentSeason + 1, 1);
            }
        }

        // Local Storage functions
        function saveLastWatched(season, episode) {
            localStorage.setItem('friends_last_watched', JSON.stringify({ season, episode }));
        }

        function loadLastWatched() {
            const saved = localStorage.getItem('friends_last_watched');
            if (saved) {
                const { season, episode } = JSON.parse(saved);
                selectSeason(season);
                playEpisode(season, episode);
            } else {
                // Default to Season 1, Episode 1
                selectSeason(1);
                playEpisode(1, 1);
            }
        }

        // Loading indicator
        function showLoading() {
            loadingIndicator.classList.add('active');
        }

        function hideLoading() {
            loadingIndicator.classList.remove('active');
        }

        // Toast notification
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Event listeners
        prevBtn.addEventListener('click', previousEpisode);
        nextBtn.addEventListener('click', nextEpisode);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !prevBtn.disabled) {
                previousEpisode();
            } else if (e.key === 'ArrowRight' && !nextBtn.disabled) {
                nextEpisode();
            }
        });

        // Double-tap/click functionality for skip forward/backward
        let lastTap = { time: 0, side: null };
        const videoContainer = document.getElementById('videoContainer');

        videoContainer.addEventListener('click', (e) => {
            const rect = videoContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const containerWidth = rect.width;
            const side = clickX < containerWidth / 2 ? 'left' : 'right';
            
            const now = Date.now();
            const timeDiff = now - lastTap.time;
            
            if (timeDiff < 300 && lastTap.side === side) {
                // Double tap detected
                if (side === 'left') {
                    showToast('⏪ Skip back 10s');
                } else {
                    showToast('⏩ Skip forward 10s');
                }
                
                // Note: The iframe doesn't allow direct control, but we show feedback
                lastTap = { time: 0, side: null };
            } else {
                lastTap = { time: now, side: side };
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
